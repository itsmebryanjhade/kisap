<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Page not found — Kisap</title>
    <style>
      :root { color-scheme:dark; --ink:#0b0b0b; --paper:#f4f1ea; --muted:#aaa79f; --signal:#ff4d3d; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px; background:var(--ink); color:var(--paper); font-family:Arial,sans-serif; }
      main { width:min(100%,680px); }
      small { color:var(--signal); letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:24px 0; font-size:clamp(3rem,10vw,7rem); font-weight:300; letter-spacing:-.07em; line-height:.9; }
      p { max-width:520px; color:var(--muted); line-height:1.7; }
      a { display:inline-block; margin-top:24px; padding:15px 22px; border-radius:999px; background:var(--paper); color:var(--ink); text-decoration:none; font-weight:700; }
    </style>
  </head>
  <body>
    <main>
      <small>404 / moment missed</small>
      <h1>This frame slipped away.</h1>
      <p>The page you requested does not exist. Your photos and unfinished Kisap session have not been uploaded or shared.</p>
      <a href="/">Return to Kisap</a>
    </main>
  </body>
</html>
